version: '3.8'

services:
  payments_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payments_app
    ports:
      - "5050:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped

volumes:
  media_data:
  static_data:
