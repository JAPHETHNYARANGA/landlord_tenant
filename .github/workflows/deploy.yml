name: Deploy Payments Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/var/www/payments_backend"
          rm: false

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/payments_backend

            echo "==> Writing .env from secrets"
            cat > .env << 'ENVEOF'
            ${{ secrets.DJANGO_ENV }}
            ENVEOF

            echo "==> Building Docker image"
            docker compose down --remove-orphans || true
            docker compose up -d --build

            echo "==> Waiting for app to be ready..."
            sleep 8

            echo "==> Running migrations"
            docker exec payments_app python manage.py migrate --noinput

            echo "==> Collecting static files"
            docker exec payments_app python manage.py collectstatic --noinput || true

            echo "==> Deployment complete! Django Payments running on port 5050"
